<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | SkyBookAI</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<nav class="navbar">

    <a href="/" class="logo">
        SkyBookAI
    </a>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/search-flights">Flights</a>
        <a href="/register">Register</a>
    </div>

</nav>


<div class="auth-page">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to manage your journey.
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                    type="email"
                    id="loginEmail"
                    required>

            <label>Password</label>

            <input
                    type="password"
                    id="loginPassword"
                    required>

            <button
                    type="submit"
                    class="primary-button full-button">

                Login

            </button>

        </form>

        <div id="loginMessage"
             class="form-message">
        </div>

        <p class="auth-switch">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</div>


<script src="/js/app.js"></script>

</body>
</html>
